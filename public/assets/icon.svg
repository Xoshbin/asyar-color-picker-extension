<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="rainbowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="25%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="dropletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="dropGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>
  <g transform="translate(-102.400 -102.400) scale(1.4)">
<!-- Rainbow Accent Arc -->
  <circle cx="256" cy="260" r="140" fill="none" stroke="url(#rainbowRing)" stroke-width="8" stroke-linecap="round" stroke-dasharray="600 300" opacity="0.85"/>

  <g filter="url(#shadow)">
    <!-- Eyedropper Body (45 degree rotation centered around 256, 260) -->
    <g transform="translate(256, 260) rotate(-45) translate(-256, -260)">
      <!-- Squeeze Bulb (top) -->
      <path d="M 234, 130 C 234, 105 278, 105 278, 130 L 278, 152 L 234, 152 Z" fill="#64748B"/>
      <!-- Collar -->
      <rect x="228" y="152" width="56" height="12" rx="4" fill="#94A3B8"/>
      <!-- Glass Tube -->
      <rect x="236" y="164" width="40" height="140" fill="#FFFFFF" fill-opacity="0.95"/>
      <!-- Liquid in Tube -->
      <rect x="240" y="210" width="32" height="90" fill="url(#rainbowRing)" rx="4"/>
      <!-- Tapered Nozzle -->
      <polygon points="236,304 276,304 262,350 250,350" fill="#FFFFFF"/>
      <polygon points="242,304 270,304 259,338 253,338" fill="url(#dropletGrad)"/>
    </g>

    <!-- Glowing Chromatic Droplet at the tip -->
    <path d="M 195, 335 C 195, 320 207, 305 207, 290 C 207, 305 219, 320 219, 335 C 219, 345 211, 353 207, 353 C 203, 353 195, 345 195, 335 Z"
          fill="url(#dropletGrad)" filter="url(#dropGlow)" transform="rotate(20 207 335)"/>
  </g>
  </g>
</svg>